name: Python environment
description: >-
  Install the data pipeline's Python dependencies. Each pipeline stage runs as
  its own job, so each one needs this. Requires the repository to already be
  checked out (a local action path cannot resolve before checkout).

inputs:
  playwright:
    description: >-
      Install the Chromium build Playwright drives. Only the Metacritic scraper
      launches a browser, so every other stage skips the ~20s install.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Install Playwright browser
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        set -euo pipefail

        # `--with-deps` shells out to `apt-get update`, and apt exits 100 when
        # ANY configured repository is unhealthy — including ones nothing here
        # uses. On 2026-09-09 Google's Chrome repo served a Packages.gz that did
        # not match its own InRelease (its CDN had the 09:41 index behind the
        # 17:16 release file), apt reported "Hash Sum mismatch" and exited 100,
        # and Playwright aborted 24 seconds into the Metacritic stage.
        #
        # Playwright takes its system libraries from the Ubuntu archives and
        # downloads its own Chromium build over HTTPS, so the third-party repos
        # baked into the runner image contribute nothing to this job. Drop them
        # rather than let their uptime decide whether the pipeline runs.
        for source in /etc/apt/sources.list.d/*; do
          [ -f "$source" ] || continue
          if grep -Eq 'dl\.google\.com|packages\.microsoft\.com' "$source"; then
            echo "Disabling apt source unused by Playwright: $source"
            sudo rm -f "$source"
          fi
        done

        # The browser download itself can still flake, and an index can go stale
        # on the Ubuntu mirrors too. Neither is worth losing the stage over.
        for attempt in 1 2 3; do
          if python -m playwright install --with-deps chromium; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            delay=$((attempt * 30))
            echo "::warning::Playwright install failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          fi
        done

        echo "::error::Playwright browser install failed after 3 attempts"
        exit 1
