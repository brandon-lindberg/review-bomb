name: Production SEO and GEO Monitor

on:
  schedule:
    # Runs after both review-data pipeline windows have exhausted their step
    # budgets (00:30 and 12:30 + ~4h40m), so the dataset it validates is
    # already published. Minute 43 deliberately avoids the player-count-scraper
    # worker minutes (*/5, 5/20/35/50, 12/27/42/57), which all write to the
    # same database and made the site least available exactly on the old :15.
    - cron: "43 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-seo-monitor
  cancel-in-progress: true

jobs:
  production-indexability:
    name: Validate production indexability, evidence, and freshness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Check fresh sitemap inventory
        run: npm run monitor:sitemaps
        working-directory: frontend
        env:
          SEO_BASE_URL: https://reviewdisparity.com
          SEO_EXPECTED_CANONICAL_ORIGIN: https://reviewdisparity.com
          SITEMAP_MIN_GAMES: "3500"
          SITEMAP_MIN_JOURNALISTS: "4000"
          SITEMAP_MIN_OUTLETS: "600"
          SEO_REQUIRE_FRESH_SITEMAPS: "1"
      - name: Check indexability, rendered evidence, GEO, and data freshness
        run: npm run test:seo
        working-directory: frontend
        env:
          SEO_BASE_URL: https://reviewdisparity.com
          SEO_EXPECTED_CANONICAL_ORIGIN: https://reviewdisparity.com
          SEO_REQUIRE_DETAIL_PAGES: "1"
          SEO_DETAIL_SAMPLES_PER_TYPE: "3"
          SEO_REQUIRE_FRESH_SITEMAPS: "1"
          SEO_MAX_DATA_AGE_HOURS: "24"
          SITEMAP_MIN_GAMES: "3500"
          SITEMAP_MIN_JOURNALISTS: "4000"
          SITEMAP_MIN_OUTLETS: "600"
