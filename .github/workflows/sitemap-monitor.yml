name: Production Sitemap Monitor

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sitemap-integrity:
    name: Validate production sitemap inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check sitemap index, counts, lastmod, and canonical URLs
        run: npm run monitor:sitemaps
        working-directory: frontend
        env:
          SEO_BASE_URL: https://reviewdisparity.com
          SEO_EXPECTED_CANONICAL_ORIGIN: https://reviewdisparity.com
          SITEMAP_MIN_GAMES: "15000"
          SITEMAP_MIN_JOURNALISTS: "8000"
          SITEMAP_MIN_OUTLETS: "500"
