name: Review Data Pipeline

on:
  schedule:
    # Twice daily, 12 hours apart
    - cron: '30 0,12 * * *'
  workflow_dispatch:

# One pipeline at a time. A second run waits rather than cancelling the first,
# because every stage writes to the shared production database.
concurrency:
  group: review-data-pipeline
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
  ENVIRONMENT: production
  FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
  FRONTEND_REVALIDATE_SECRET: ${{ secrets.FRONTEND_REVALIDATE_SECRET }}

# Each stage is its own job, not just its own step, so that losing one runner
# costs one stage instead of the whole pipeline. On 2026-09-08 a runner dropped
# its network 17 minutes into the sync — well inside that stage's budget — and
# the job was cancelled, which skipped match, Metacritic, both disparity
# refreshes and revalidation. Roughly 1h45m of downstream work was thrown away
# over a blip that had nothing to do with any of it.
#
# `!cancelled()` is what keeps the chain moving when a stage fails or its runner
# dies, while still stopping everything when someone cancels the run by hand.
# The migration is the one hard gate: if the schema did not apply, no later
# stage should touch the database.
jobs:
  migrate:
    name: Migrate database schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      - name: Migrate database schema
        timeout-minutes: 10
        run: alembic upgrade head

  sync:
    name: Sync OpenCritic catalog
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      - name: Sync OpenCritic catalog
        # Observed 28-40 min across the last 15 successful runs.
        timeout-minutes: 90
        run: python -u -m app sync

  match:
    name: Match games to Steam and Metacritic
    runs-on: ubuntu-latest
    needs: [migrate, sync]
    if: ${{ !cancelled() && needs.migrate.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      - name: Match games to Steam and Metacritic
        # Observed 12-13 min.
        timeout-minutes: 30
        run: python -u -m app match --days 10 --limit 300

  metacritic:
    name: Sync Metacritic scores
    runs-on: ubuntu-latest
    needs: [migrate, match]
    if: ${{ !cancelled() && needs.migrate.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
        with:
          playwright: 'true'
      - name: Sync Metacritic scores
        # Raised from 60. This stage averages 49 min and peaked at 55m58s across
        # the last 15 runs — 93% of the old budget, while every other stage sits
        # under 45%. It was the next thing due to fail, and it would have failed
        # with the same "The operation was canceled." as a lost runner.
        timeout-minutes: 90
        run: python -u -m app metacritic --recent 10 --limit 300

  disparity:
    name: Refresh disparity and publish site stats
    runs-on: ubuntu-latest
    needs: [migrate, metacritic]
    if: ${{ !cancelled() && needs.migrate.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      # Both refreshes share a job: they run back to back, need the same
      # environment, and take about 9 and 7 minutes respectively.
      - name: Refresh journalist and outlet disparity
        timeout-minutes: 45
        run: python -u -m app disparity --journalists --outlets
      - name: Refresh game disparity and publish site stats
        timeout-minutes: 45
        run: python -u -m app disparity --games

  revalidate:
    name: Revalidate public discovery surfaces
    runs-on: ubuntu-latest
    needs: [migrate, disparity]
    if: ${{ !cancelled() && needs.migrate.result == 'success' }}
    steps:
      - name: Revalidate public discovery surfaces
        shell: bash
        run: |
          if [[ -z "$FRONTEND_REVALIDATE_URL" || -z "$FRONTEND_REVALIDATE_SECRET" ]]; then
            echo "::warning::Frontend revalidation is not configured; skipping cache refresh."
            exit 0
          fi

          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST "$FRONTEND_REVALIDATE_URL" \
            --header "Authorization: Bearer $FRONTEND_REVALIDATE_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"paths":["/","/about","/games","/journalists","/outlets","/leaderboards","/sitemap.xml","/sitemaps/games.xml","/sitemaps/journalists.xml","/sitemaps/outlets.xml"],"reason":"review_data_pipeline"}'
