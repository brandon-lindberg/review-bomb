name: Refresh Specific Games

# Pull named games up to date without waiting for, or re-running, the whole
# review pipeline. Built for big releases: on 2026-09-13 Marvel's Wolverine had
# been reviewed for three days while the scheduled pipeline never selected it.
on:
  workflow_dispatch:
    inputs:
      opencritic_ids:
        description: 'OpenCritic IDs, space- or comma-separated (e.g. 17842)'
        required: false
        type: string
      metacritic_title:
        description: 'Optional: also re-scrape Metacritic for titles containing this text'
        required: false
        type: string
        default: ''
      metacritic_for_ids:
        description: 'Scrape Metacritic for the supplied OpenCritic IDs'
        required: false
        type: boolean
        default: false
      catalog_audit:
        description: 'Also check historical OpenCritic ID gaps and import valid missing games'
        required: false
        type: boolean
        default: false
      catalog_audit_from:
        description: 'OpenCritic ID to resume the catalog audit from'
        required: false
        type: number
        default: 1

# Runs of this workflow queue behind each other. It does not share the review
# pipeline's group: that would park a one-game refresh behind a two-hour run,
# and every write here is an idempotent per-game upsert.
concurrency:
  group: refresh-games
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
  ENVIRONMENT: production
  FRONTEND_REVALIDATE_URL: ${{ secrets.FRONTEND_REVALIDATE_URL }}
  FRONTEND_REVALIDATE_SECRET: ${{ secrets.FRONTEND_REVALIDATE_SECRET }}

jobs:
  refresh:
    name: Refresh games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
        with:
          playwright: ${{ (inputs.metacritic_title != '' || inputs.metacritic_for_ids) && 'true' || 'false' }}

      - name: Migrate database schema
        timeout-minutes: 10
        run: alembic upgrade head

      - name: Require a refresh or audit input
        if: ${{ inputs.opencritic_ids == '' && inputs.metacritic_title == '' && !inputs.catalog_audit }}
        run: |
          echo "::error::Supply OpenCritic IDs, a Metacritic title, or enable the catalog audit."
          exit 1

      - name: Refresh OpenCritic metadata and reviews
        if: ${{ inputs.opencritic_ids != '' }}
        timeout-minutes: 20
        # Inputs arrive through env, never interpolated into the script, so a
        # crafted value cannot run as shell.
        env:
          OPENCRITIC_IDS: ${{ inputs.opencritic_ids }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for id in ${OPENCRITIC_IDS//,/ }; do
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "::error::Not an OpenCritic ID: $id"
              exit 1
            fi
            args+=(--opencritic-id "$id")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error::No OpenCritic IDs given"
            exit 1
          fi
          python -u -m app refresh-reviews "${args[@]}"

      - name: Refresh Metacritic scores
        if: ${{ inputs.metacritic_title != '' || (inputs.metacritic_for_ids && inputs.opencritic_ids != '') }}
        timeout-minutes: 20
        env:
          METACRITIC_TITLE: ${{ inputs.metacritic_title }}
          METACRITIC_FOR_IDS: ${{ inputs.metacritic_for_ids }}
          OPENCRITIC_IDS: ${{ inputs.opencritic_ids }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$METACRITIC_FOR_IDS" == true && -n "$OPENCRITIC_IDS" ]]; then
            for id in ${OPENCRITIC_IDS//,/ }; do
              args+=(--opencritic-id "$id")
            done
          else
            args+=(--title "$METACRITIC_TITLE")
          fi
          python -u -m app metacritic "${args[@]}" --stale-days 0

      - name: Audit and backfill OpenCritic catalog gaps
        if: ${{ inputs.catalog_audit }}
        timeout-minutes: 45
        env:
          CATALOG_AUDIT_FROM: ${{ inputs.catalog_audit_from }}
        run: python -u -m app sync --catalog-gaps --catalog-gap-start "$CATALOG_AUDIT_FROM"

      # Game pages revalidate every 60s on their own. A game that just gained
      # its first reviews also becomes eligible for the listings, which do not.
      - name: Revalidate listings
        shell: bash
        run: |
          if [[ -z "$FRONTEND_REVALIDATE_URL" || -z "$FRONTEND_REVALIDATE_SECRET" ]]; then
            echo "::warning::Frontend revalidation is not configured; skipping cache refresh."
            exit 0
          fi

          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST "$FRONTEND_REVALIDATE_URL" \
            --header "Authorization: Bearer $FRONTEND_REVALIDATE_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"paths":["/","/games","/sitemap.xml","/sitemaps/games.xml"],"reason":"refresh_games"}'
